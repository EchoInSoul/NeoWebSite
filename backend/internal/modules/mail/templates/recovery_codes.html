<!DOCTYPE html>
<html lang="zh-CN">
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:-apple-system,'Segoe UI',sans-serif;color:#222">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:6px;padding:24px">
      <h2 style="margin:0 0 12px;font-size:18px">{{.siteTitle}} 两步验证恢复码</h2>
      <p style="margin:0 0 12px;line-height:1.7">你好 {{.username}}，</p>
      <p style="margin:0 0 12px;line-height:1.7">这是你的两步验证恢复码，每张只能使用一次，请妥善保存：</p>
      <pre style="margin:0 0 12px;padding:12px 16px;background:#f5f5f5;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.9">{{.codes}}</pre>
      <p style="margin:0 0 12px;color:#666666;font-size:13px">如果这不是你本人操作，请立即修改密码。</p>
      <p style="margin:0;color:#666666;font-size:13px">{{.siteTitle}} · {{.siteUrl}} · {{.sentAt}}</p>
    </div>
  </body>
</html>
