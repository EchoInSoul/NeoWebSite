<!DOCTYPE html>
<html lang="zh-CN">
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:-apple-system,'Segoe UI',sans-serif;color:#222">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:6px;padding:24px">
      <h2 style="margin:0 0 12px;font-size:18px">{{.siteTitle}} 注册验证码</h2>
      <p style="margin:0 0 12px;line-height:1.7">你好 {{.username}}，</p>
      <p style="margin:0 0 12px;line-height:1.7">你的注册验证码是 <strong style="font-size:20px;letter-spacing:2px">{{.code}}</strong>，{{.expiresMinutes}} 分钟内有效。</p>
      <p style="margin:0 0 12px;color:#666666;font-size:13px">如果不是你本人操作，请忽略这封邮件。</p>
      <p style="margin:0;color:#666666;font-size:13px">{{.siteTitle}} · {{.siteUrl}} · {{.sentAt}}</p>
    </div>
  </body>
</html>
