<!DOCTYPE html>
<html lang="zh-CN">
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:-apple-system,'Segoe UI',sans-serif;color:#222">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:6px;padding:24px">
      <h2 style="margin:0 0 12px;font-size:18px">{{.siteTitle}} 注册验证</h2>
      <p style="margin:0 0 12px;line-height:1.7">你好 {{.username}}，</p>
      <p style="margin:0 0 12px;line-height:1.7">请点击下面的链接完成邮箱验证（{{.expiresMinutes}} 分钟内有效）：</p>
      <p style="margin:0 0 12px"><a href="{{.verifyUrl}}" style="display:inline-block;padding:10px 18px;background:#111111;color:#ffffff;border-radius:6px;text-decoration:none">验证邮箱</a></p>
      <p style="margin:0 0 12px;color:#666666;font-size:13px;word-break:break-all">{{.verifyUrl}}</p>
      <p style="margin:0 0 12px;color:#666666;font-size:13px">如果不是你本人操作，请忽略这封邮件。</p>
      <p style="margin:0;color:#666666;font-size:13px">{{.siteTitle}} · {{.siteUrl}} · {{.sentAt}}</p>
    </div>
  </body>
</html>
